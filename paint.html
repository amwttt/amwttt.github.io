<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fce4ec;
    overflow: hidden;
}
.main {
    display: flex;
    width: 100vw;
    height: 100vh;
}
.left-bar {
    width: 85px;
    min-width: 85px;
    height: 100vh;
    background: #fff0f6;
    border-right: 1px solid #e5a9bd;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    overflow: hidden;
}
.tool-title {
    font-size: 12px;
    font-weight: bold;
    color: #c2185b;
}
.tool {
    width: 55px;
    height: 45px;
    border: 1px solid transparent;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 23px;
}
.tool:hover {
    background: #ffd6e6;
}
.tool.active {
    background: #f8a5c2;
    border: 2px solid #c2185b;
}
.history {
    display: flex;
    gap: 5px;
}
.history .tool {
    width: 36px;
    height: 36px;
}
.divider {
    width: 65px;
    height: 1px;
    background: #e5a9bd;
    margin: 2px 0;
    flex-shrink: 0;
}
.geometry-tools {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.tool.geometry {
    width: 55px;
    height: 45px;
    padding: 0;
}
.sizes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}
.size-title {
    font-size: 10px;
    font-weight: bold;
    color: #c2185b;
}
.size-button {
    width: 55px;
    height: 32px;
    border: 1px solid transparent;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.size-button:hover {
    background: #ffd6e6;
}
.size-button.active {
    background: #f8a5c2;
    border: 2px solid #c2185b;
}
.size-dot {
    display: block;
    background: #000;
}
.workspace {
    flex: 1;
    min-width: 0;
    min-height: 0;
    background: #e8dce1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
}
.canvas-box {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
canvas {
    display: block;
    width: min(100%, 1100px);
    height: auto;
    max-height: 100%;
    aspect-ratio: 4 / 3;
    background: white;
    image-rendering: pixelated;
    cursor: crosshair;
    box-shadow: 0 3px 12px #aaa;
}
.right-bar {
    width: 105px;
    min-width: 105px;
    height: 100vh;
    background: #fff0f6;
    border-left: 1px solid #e5a9bd;
    padding: 12px 8px;
    flex-shrink: 0;
}
.color-title {
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #c2185b;
    margin-bottom: 10px;
}
.color-grid {
    display: grid;
    grid-template-columns: repeat(2, 28px);
    justify-content: center;
    gap: 7px;
}
.color {
    width: 28px;
    height: 28px;
    border: 2px solid #aaa;
    border-radius: 5px;
    cursor: pointer;
}
.color:hover {
    border-color: #c2185b;
    transform: scale(1.08);
}
.color-picker {
    display: block;
    width: 50px;
    height: 40px;
    padding: 2px;
    margin: 12px auto 0;
    border: 2px solid #aaa;
    border-radius: 6px;
    cursor: pointer;
    background: white;
}
</style>
</head>
<body>
<div class="main">
    <div class="left-bar">
        <div class="history">
            <button class="tool" onclick="undo()">↶</button>
            <button class="tool" onclick="redo()">↷</button>
        </div>
        <div class="divider"></div>
        <div class="tool-title">Tools</div>
        <button class="tool active" onclick="setTool('pencil', this)">✏️</button>
        <button class="tool" onclick="setTool('brush', this)">🖌️</button>
        <button class="tool" onclick="setTool('eraser', this)">🧽</button>
        <button class="tool" onclick="setTool('fill', this)">🪣</button>
        <div class="divider"></div>
        <div class="geometry-tools">
            <button class="tool geometry" onclick="setTool('line', this)">/</button>
            <button class="tool geometry" onclick="setTool('rectangle', this)">□</button>
            <button class="tool geometry" onclick="setTool('circle', this)">○</button>
            <button class="tool geometry" onclick="setTool('triangle', this)">△</button>
        </div>
        <div class="divider"></div>
        <div class="sizes">
            <div class="size-title">Size</div>
            <button class="size-button active" onclick="setSize(3, this)">
                <span class="size-dot" style="width:3px;height:3px;"></span>
            </button>
            <button class="size-button" onclick="setSize(5, this)">
                <span class="size-dot" style="width:5px;height:5px;"></span>
            </button>
            <button class="size-button" onclick="setSize(10, this)">
                <span class="size-dot" style="width:10px;height:10px;"></span>
            </button>
        </div>
    </div>
    <div class="workspace">
        <div class="canvas-box">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
    </div>
    <div class="right-bar">
        <div class="color-title">Colors</div>
        <div class="color-grid">
            <div class="color" style="background:#000000" onclick="setColor('#000000')"></div>
            <div class="color" style="background:#808080" onclick="setColor('#808080')"></div>
            <div class="color" style="background:#ffffff" onclick="setColor('#ffffff')"></div>
            <div class="color" style="background:#ff1744" onclick="setColor('#ff1744')"></div>
            <div class="color" style="background:#ff9800" onclick="setColor('#ff9800')"></div>
            <div class="color" style="background:#ffeb3b" onclick="setColor('#ffeb3b')"></div>
            <div class="color" style="background:#4caf50" onclick="setColor('#4caf50')"></div>
            <div class="color" style="background:#2196f3" onclick="setColor('#2196f3')"></div>
            <div class="color" style="background:#9c27b0" onclick="setColor('#9c27b0')"></div>
            <div class="color" style="background:#ff4081" onclick="setColor('#ff4081')"></div>
        </div>
        <input type="color" id="customColor" class="color-picker" value="#000000" onchange="setCustomColor(this.value)">
    </div>
</div>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const customColor = document.getElementById("customColor");
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels = imageData.data;

let currentTool = "pencil";
let currentColor = "#000000";
let currentSize = 3;
let isDrawing = false;
let previousX = 0;
let previousY = 0;
let startX = 0;
let startY = 0;
let oldImage = null;
let history = [];
let historyIndex = -1;

function hexToRgb(hex) {
    return {
        r: parseInt(hex.substring(1, 3), 16),
        g: parseInt(hex.substring(3, 5), 16),
        b: parseInt(hex.substring(5, 7), 16)
    };
}

function putPixel(x, y, r, g, b, a = 255) {
    x = Math.floor(x);
    y = Math.floor(y);

    if (
        x < 0 ||
        x >= canvas.width ||
        y < 0 ||
        y >= canvas.height
    ) {
        return;
    }

    const index = (y * canvas.width + x) * 4;

    pixels[index] = r;
    pixels[index + 1] = g;
    pixels[index + 2] = b;
    pixels[index + 3] = a;
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
    x1 = Math.round(x1);
    y1 = Math.round(y1);
    x2 = Math.round(x2);
    y2 = Math.round(y2);

    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);
    const sx = x1 < x2 ? 1 : -1;
    const sy = y1 < y2 ? 1 : -1;

    let err = dx - dy;

    while (true) {
        putPixel(x1, y1, r, g, b, a);

        if (x1 === x2 && y1 === y2) {
            break;
        }

        const e2 = 2 * err;

        if (e2 > -dy) {
            err -= dy;
            x1 += sx;
        }

        if (e2 < dx) {
            err += dx;
            y1 += sy;
        }
    }
}

function drawThickLine(x1, y1, x2, y2, size, r, g, b, a = 255) {
    const radius = Math.floor(size / 2);
    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);
    const steps = Math.max(dx, dy);

    for (let i = 0; i <= steps; i++) {
        const t = steps === 0 ? 0 : i / steps;
        const x = Math.round(x1 + (x2 - x1) * t);
        const y = Math.round(y1 + (y2 - y1) * t);

        for (let yy = -radius; yy <= radius; yy++) {
            for (let xx = -radius; xx <= radius; xx++) {
                putPixel(
                    x + xx,
                    y + yy,
                    r,
                    g,
                    b,
                    a
                );
            }
        }
    }
}

function drawShapeLine(x1, y1, x2, y2, r, g, b) {
    drawThickLine(
        x1,
        y1,
        x2,
        y2,
        currentSize,
        r,
        g,
        b,
        255
    );
}

function getMousePosition(event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
        x: Math.floor((event.clientX - rect.left) * scaleX),
        y: Math.floor((event.clientY - rect.top) * scaleY)
    };
}

function setTool(tool, button) {
    currentTool = tool;

    document.querySelectorAll(".tool").forEach(function(item) {
        item.classList.remove("active");
    });

    button.classList.add("active");
}

function setSize(size, button) {
    currentSize = size;

    document.querySelectorAll(".size-button").forEach(function(item) {
        item.classList.remove("active");
    });

    button.classList.add("active");
}

function setColor(color) {
    currentColor = color;
    customColor.value = color;
}

function setCustomColor(color) {
    currentColor = color;
}

function clearCanvas() {
    for (let i = 0; i < pixels.length; i += 4) {
        pixels[i] = 255;
        pixels[i + 1] = 255;
        pixels[i + 2] = 255;
        pixels[i + 3] = 255;
    }

    ctx.putImageData(imageData, 0, 0);
}

function saveHistory() {
    history = history.slice(0, historyIndex + 1);
    history.push(new Uint8ClampedArray(pixels));
    historyIndex++;

    if (history.length > 30) {
        history.shift();
        historyIndex--;
    }
}

function restoreHistory(data) {
    pixels.set(data);
    ctx.putImageData(imageData, 0, 0);
}

function undo() {
    if (historyIndex > 0) {
        historyIndex--;
        restoreHistory(history[historyIndex]);
    }
}

function redo() {
    if (historyIndex < history.length - 1) {
        historyIndex++;
        restoreHistory(history[historyIndex]);
    }
}

function drawPencil(x1, y1, x2, y2) {
    const color = hexToRgb(currentColor);

    const pencilSize = Math.max(
        1,
        Math.floor(currentSize * 0.6)
    );

    drawThickLine(
        x1,
        y1,
        x2,
        y2,
        pencilSize,
        color.r,
        color.g,
        color.b,
        255
    );
}

function drawBrush(x1, y1, x2, y2) {
    const color = hexToRgb(currentColor);

    let size = 5;

    if (currentSize === 5) {
        size = 8;
    }

    if (currentSize === 10) {
        size = 14;
    }

    drawThickLine(
        x1,
        y1,
        x2,
        y2,
        size,
        color.r,
        color.g,
        color.b,
        255
    );
}

function erase(x1, y1, x2, y2) {
    drawThickLine(
        x1,
        y1,
        x2,
        y2,
        currentSize,
        255,
        255,
        255,
        255
    );
}

function drawRectangle(x1, y1, x2, y2, r, g, b) {
    drawShapeLine(x1, y1, x2, y1, r, g, b);
    drawShapeLine(x2, y1, x2, y2, r, g, b);
    drawShapeLine(x2, y2, x1, y2, r, g, b);
    drawShapeLine(x1, y2, x1, y1, r, g, b);
}

function drawCircle(cx, cy, radius, r, g, b) {
    const steps = Math.max(
        30,
        Math.floor(radius * 8)
    );

    let previousX = Math.round(cx + radius);
    let previousY = Math.round(cy);

    for (let i = 1; i <= steps; i++) {
        const angle = (i / steps) * Math.PI * 2;

        const x = Math.round(
            cx + Math.cos(angle) * radius
        );

        const y = Math.round(
            cy + Math.sin(angle) * radius
        );

        drawShapeLine(
            previousX,
            previousY,
            x,
            y,
            r,
            g,
            b
        );

        previousX = x;
        previousY = y;
    }
}

function drawTriangle(x1, y1, x2, y2, r, g, b) {
    const topX = Math.round((x1 + x2) / 2);
    const topY = Math.min(y1, y2);
    const bottomY = Math.max(y1, y2);

    drawShapeLine(
        topX,
        topY,
        x1,
        bottomY,
        r,
        g,
        b
    );

    drawShapeLine(
        x1,
        bottomY,
        x2,
        bottomY,
        r,
        g,
        b
    );

    drawShapeLine(
        x2,
        bottomY,
        topX,
        topY,
        r,
        g,
        b
    );
}

function fillColor(x, y) {
    const targetIndex = (y * canvas.width + x) * 4;

    const targetR = pixels[targetIndex];
    const targetG = pixels[targetIndex + 1];
    const targetB = pixels[targetIndex + 2];

    const color = hexToRgb(currentColor);

    if (
        targetR === color.r &&
        targetG === color.g &&
        targetB === color.b
    ) {
        return;
    }

    const stack = [[x, y]];

    while (stack.length > 0) {
        const point = stack.pop();
        const px = point[0];
        const py = point[1];

        if (
            px < 0 ||
            px >= canvas.width ||
            py < 0 ||
            py >= canvas.height
        ) {
            continue;
        }

        const index = (py * canvas.width + px) * 4;

        if (
            pixels[index] !== targetR ||
            pixels[index + 1] !== targetG ||
            pixels[index + 2] !== targetB
        ) {
            continue;
        }

        pixels[index] = color.r;
        pixels[index + 1] = color.g;
        pixels[index + 2] = color.b;
        pixels[index + 3] = 255;

        stack.push(
            [px + 1, py],
            [px - 1, py],
            [px, py + 1],
            [px, py - 1]
        );
    }

    ctx.putImageData(imageData, 0, 0);
}

canvas.addEventListener("mousedown", function(event) {
    const pos = getMousePosition(event);

    isDrawing = true;
    previousX = pos.x;
    previousY = pos.y;
    startX = pos.x;
    startY = pos.y;

    if (currentTool === "pencil") {
        drawPencil(
            pos.x,
            pos.y,
            pos.x,
            pos.y
        );

        ctx.putImageData(imageData, 0, 0);
        return;
    }

    if (currentTool === "brush") {
        drawBrush(
            pos.x,
            pos.y,
            pos.x,
            pos.y
        );

        ctx.putImageData(imageData, 0, 0);
        return;
    }

    if (currentTool === "eraser") {
        erase(
            pos.x,
            pos.y,
            pos.x,
            pos.y
        );

        ctx.putImageData(imageData, 0, 0);
        return;
    }

    if (currentTool === "fill") {
        fillColor(pos.x, pos.y);
        isDrawing = false;
        saveHistory();
        return;
    }

    oldImage = new Uint8ClampedArray(pixels);
});

canvas.addEventListener("mousemove", function(event) {
    if (!isDrawing) {
        return;
    }

    const pos = getMousePosition(event);

    if (currentTool === "pencil") {
        drawPencil(
            previousX,
            previousY,
            pos.x,
            pos.y
        );

        previousX = pos.x;
        previousY = pos.y;

        ctx.putImageData(imageData, 0, 0);
        return;
    }

    if (currentTool === "brush") {
        drawBrush(
            previousX,
            previousY,
            pos.x,
            pos.y
        );

        previousX = pos.x;
        previousY = pos.y;

        ctx.putImageData(imageData, 0, 0);
        return;
    }

    if (currentTool === "eraser") {
        erase(
            previousX,
            previousY,
            pos.x,
            pos.y
        );

        previousX = pos.x;
        previousY = pos.y;

        ctx.putImageData(imageData, 0, 0);
        return;
    }

    pixels.set(oldImage);

    const color = hexToRgb(currentColor);

    if (currentTool === "line") {
        drawShapeLine(
            startX,
            startY,
            pos.x,
            pos.y,
            color.r,
            color.g,
            color.b
        );
    }

    if (currentTool === "rectangle") {
        drawRectangle(
            startX,
            startY,
            pos.x,
            pos.y,
            color.r,
            color.g,
            color.b
        );
    }

    if (currentTool === "circle") {
        const radius = Math.round(
            Math.hypot(
                pos.x - startX,
                pos.y - startY
            )
        );

        drawCircle(
            startX,
            startY,
            radius,
            color.r,
            color.g,
            color.b
        );
    }

    if (currentTool === "triangle") {
        drawTriangle(
            startX,
            startY,
            pos.x,
            pos.y,
            color.r,
            color.g,
            color.b
        );
    }

    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener("mouseup", function() {
    if (!isDrawing) {
        return;
    }

    isDrawing = false;
    saveHistory();
});

canvas.addEventListener("mouseleave", function() {
    if (isDrawing) {
        isDrawing = false;
        saveHistory();
    }
});

window.addEventListener("keydown", function(event) {
    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "z"
    ) {
        event.preventDefault();
        undo();
    }

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "y"
    ) {
        event.preventDefault();
        redo();
    }
});

clearCanvas();
saveHistory();
</script>
</body>
</html>
