<!DOCTYPE html>
<html>

<head>
    <title>Assignment #3 : Next Gen Rendering (PBR Hot Rod)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }


        #panel {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top, 0px));
            right: 10px;
            width: min(280px, 72vw);
            max-height: calc(100% - 20px - env(safe-area-inset-top, 0px));
            overflow-y: auto;
            background: rgba(22, 10, 32, .85);
            color: #fff;
            font: 13px sans-serif;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .4);
            -webkit-user-select: none;
            user-select: none;
        }
        #phead { padding: 10px 12px; font-weight: 700; background: rgba(255, 255, 255, .1); border-radius: 10px 10px 0 0; position: sticky; top: 0; }
        #pbody { padding: 4px 12px 12px; }
        #panel details { border-bottom: 1px solid rgba(255, 255, 255, .15); padding: 6px 0; }
        #panel summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
        #panel .row { margin: 8px 0 4px; }
        #panel .lbl { display: flex; justify-content: space-between; }
        #panel .val { opacity: .8; font-variant-numeric: tabular-nums; }
        #panel .crow { display: flex; justify-content: space-between; align-items: center; }
        #panel input[type=range] { width: 100%; height: 30px; margin: 2px 0 0; accent-color: #ffb347; touch-action: pan-y; }
        #panel .sec { border-bottom: 1px solid rgba(255, 255, 255, .15); padding: 6px 0; }
        #panel .stitle { font-weight: 600; padding: 4px 0; }
        #panel .crow { display: flex; justify-content: space-between; align-items: center; }
        #panel input[type=color] { width: 56px; height: 28px; border: 0; padding: 0; background: none; }
        #panel .note { margin-top: 8px; font-size: 12px; line-height: 1.5; opacity: .75; }
    </style>
</head>

<body>
    <div id="status" style="position:fixed;top:8px;left:8px;color:#fff;font:14px sans-serif;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:6px">กำลังโหลดโมเดลรถ...</div>
    <div id="panel"></div>

    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>

        // ---------------- Renderer ----------------
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a0a5e); // สีสำรอง ถ้า EXR โหลดไม่ได้

        // ---------------- Camera + Mouse control ----------------
        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(11, 6.5, 14);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.5, 0); // มองที่รถตรงกลางฉากเสมอ
        controls.minDistance = 5;
        controls.maxDistance = 40;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // ไม่ให้กล้องลงใต้พื้น
        controls.update();

        // ---------------- Lights ----------------
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        scene.add(ambientLight);

        // แหล่งกำเนิดแสงหลัก (ย้ายตำแหน่งได้ด้วย GUI และการคลิกที่พื้น)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(6, 8, 6);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.set(2048, 2048);
        directionalLight.shadow.camera.left = -18;
        directionalLight.shadow.camera.right = 18;
        directionalLight.shadow.camera.top = 18;
        directionalLight.shadow.camera.bottom = -18;
        directionalLight.shadow.camera.far = 60;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);

        // ลูกบอลเล็ก ๆ แสดงตำแหน่งของแสง
        const lightMarker = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 32, 16),
            new THREE.MeshBasicMaterial({ color: 0xfff2b0 })
        );
        scene.add(lightMarker);

        // สำรอง: สร้าง environment จำลอง (studio) เมื่อโหลด EXR ไม่ได้
        function proceduralEnv() {
            const env = new THREE.Scene();
            const dome = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16),
                new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true }));
            const pos = dome.geometry.attributes.position, col = [];
            for (let i = 0; i < pos.count; i++) {
                const t = (pos.getY(i) / 50 + 1) / 2;
                const c = new THREE.Color().lerpColors(new THREE.Color(0x2b0c3a), new THREE.Color(0xb48cd0), t);
                col.push(c.r, c.g, c.b);
            }
            dome.geometry.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
            env.add(dome);
            const softbox = (x, y, z, w, hh, c) => {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(w, hh),
                    new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(6), side: THREE.DoubleSide }));
                m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
            };
            softbox(0, 40, 0, 30, 30, 0xffffff); softbox(-35, 15, 10, 12, 25, 0xffe2c0);
            softbox(35, 12, -10, 12, 25, 0xc0d8ff); softbox(0, 10, -40, 30, 8, 0xffffff);
            const pm = new THREE.PMREMGenerator(renderer);
            scene.environment = pm.fromScene(env, 0.02).texture;
            updateEnv();
        }

        // ---------------- Environment (EXR skybox) ----------------
        const exrSkyboxUrl = 'https://amwttt.github.io/rathaus_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.HalfFloatType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
                proceduralEnv();
            });

        // ---------------- พื้น (PBR) ----------------
        const floorTexLoader = new THREE.TextureLoader();
        function floorTex(url, srgb) {
            const t = floorTexLoader.load(url);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(6, 6);          // ซ้ำลายกระเบื้องบนพื้น 60x60
            t.anisotropy = 16;
            t.encoding = srgb ? THREE.sRGBEncoding : THREE.LinearEncoding;
            return t;
        }
        const matFloor = new THREE.MeshStandardMaterial({
            map: floorTex('https://amwttt.github.io/square_floor_diff_1k.jpg', true),            // Base color (diffuse)
            roughnessMap: floorTex('https://amwttt.github.io/square_floor_rough_1k.jpg', false),  // Roughness
            color: 0xffffff,
            roughness: 1.0,
            metalness: 0.0
        });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // ---------------- สิ่งปลูกสร้าง: เสาไฟ 4 ต้น (PBR) ----------------
        const steelMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.4, metalness: 0.8 });   // เสาและฐานสีดำ (metal)
        const lampMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.6, roughness: 0.3, metalness: 0.0 }); // โคมกลมสีขาวขุ่น (Emissive)
        // เสาไฟแบบเบสิก: เสา (Cylinder) + หลอดไฟ (Sphere)
        function lampPost(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6, 16), steelMat);
            pole.position.set(x, 3, z);
            pole.castShadow = true;
            scene.add(pole);

            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), lampMat);
            bulb.position.set(x, 6.5, z);
            scene.add(bulb);
        }
        for (const x of [-9, 9]) for (const z of [-8, 8]) lampPost(x, z);

        // ---------------- ตัวละครหลัก: Hot Rod (glTF + PBR textures) ----------------
        const carMaterials = [];
        const carParams = {
            tint: '#ffffff',
            metallic: 1.0,   // ตัวคูณกับ Metallic map
            roughness: 1.0   // ตัวคูณกับ Roughness map
        };
        const envParams = { envIntensity: 1.0 };

        const loader = new THREE.GLTFLoader();
        loader.load('https://amwttt.github.io/hotrod_texture_baked.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (!carMaterials.includes(child.material)) carMaterials.push(child.material);
                }
            });

            // ปรับขนาดให้ยาวประมาณ 7.2 หน่วย แล้ววางบนพื้นตรงกลาง
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            model.scale.setScalar(7.2 / Math.max(size.x, size.z));
            box.setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.set(-center.x, -box.min.y, -center.z); // กึ่งกลางอยู่ที่ (0,0,0)

            // pivot อยู่กลางฉากบนพื้น หมุนเพื่อให้รถหันเฉียงเข้าหากล้อง
            const carPivot = new THREE.Group();
            carPivot.position.set(0, 0, 0);
            carPivot.rotation.y = -0.5;
            carPivot.add(model);
            scene.add(carPivot);
            document.getElementById('status').style.display = 'none';
            updateCar();
        }, undefined, (error) => {
            console.error('Unable to load GLB (ต้องเปิดผ่าน web server / GitHub Pages):', error);
            document.getElementById('status').textContent = 'โหลดรถไม่สำเร็จ: ' + (error && error.message ? error.message : error);
        });

        function updateCar() {
            carMaterials.forEach((m) => {
                m.color.set(carParams.tint);
                m.metalness = carParams.metallic;
                m.roughness = carParams.roughness;
            });
        }
        function updateEnv() {
            scene.traverse((o) => {
                if (o.material && o.material.envMapIntensity !== undefined) {
                    o.material.envMapIntensity = envParams.envIntensity;
                }
            });
        }

        // ---------------- GUI ----------------
        // ---------------- Controls panel (sliders) ----------------
        let refreshControls = () => { };
        try {
            const panel = document.getElementById('panel');
            const title = document.createElement('div');
            title.id = 'phead';
            title.textContent = 'Controls';
            const body = document.createElement('div');
            body.id = 'pbody';
            panel.append(title, body);
            const items = [];

            function section(name) {
                const d = document.createElement('div');
                d.className = 'sec';
                const t = document.createElement('div');
                t.className = 'stitle';
                t.textContent = name;
                d.appendChild(t);
                body.appendChild(d);
                return d;
            }
            function slider(sec, label, min, max, step, get, set) {
                const row = document.createElement('div');
                row.className = 'row';
                const top = document.createElement('div');
                top.className = 'lbl';
                const name = document.createElement('span');
                name.textContent = label;
                const val = document.createElement('span');
                val.className = 'val';
                top.append(name, val);
                const inp = document.createElement('input');
                inp.type = 'range';
                inp.min = min; inp.max = max; inp.step = step;
                const show = () => { inp.value = get(); val.textContent = (+get()).toFixed(2); };
                inp.oninput = () => { set(+inp.value); val.textContent = (+inp.value).toFixed(2); };
                row.append(top, inp);
                sec.appendChild(row);
                show();
                items.push(show);
            }

            function color(sec, label, get, set) {
                const row = document.createElement('div');
                row.className = 'row crow';
                const name = document.createElement('span');
                name.textContent = label;
                const inp = document.createElement('input');
                inp.type = 'color';
                inp.value = get();
                inp.oninput = () => set(inp.value);
                row.append(name, inp);
                sec.appendChild(row);
                items.push(() => { inp.value = get(); });
            }

            // ย้ายตำแหน่งแหล่งกำเนิดแสง
            const sLight = section('Light');
            slider(sLight, 'X', -15, 15, 0.1, () => directionalLight.position.x, (v) => directionalLight.position.x = v);
            slider(sLight, 'Y', 1, 20, 0.1, () => directionalLight.position.y, (v) => directionalLight.position.y = v);
            slider(sLight, 'Z', -15, 15, 0.1, () => directionalLight.position.z, (v) => directionalLight.position.z = v);
            slider(sLight, 'Intensity', 0, 6, 0.05, () => directionalLight.intensity, (v) => directionalLight.intensity = v);
            const hint = document.createElement('div');
            hint.className = 'note';
            hint.innerHTML = 'Drag the light ball: move X / Z<br>Shift + drag: move Y<br>Click the floor: move light there';
            sLight.appendChild(hint);

            // คุณสมบัติ PBR ของตัวละครหลัก
            const sCar = section('Car (PBR)');
            color(sCar, 'Base color', () => carParams.tint, (v) => { carParams.tint = v; updateCar(); });
            slider(sCar, 'Metallic', 0, 1, 0.01, () => carParams.metallic, (v) => { carParams.metallic = v; updateCar(); });
            slider(sCar, 'Roughness', 0, 1.5, 0.01, () => carParams.roughness, (v) => { carParams.roughness = v; updateCar(); });

            // คุณสมบัติ PBR ของพื้น
            const sFloor = section('Floor (PBR)');
            color(sFloor, 'Base color', () => '#' + matFloor.color.getHexString(), (v) => matFloor.color.set(v));
            slider(sFloor, 'Metallic', 0, 1, 0.01, () => matFloor.metalness, (v) => matFloor.metalness = v);
            slider(sFloor, 'Roughness', 0, 1, 0.01, () => matFloor.roughness, (v) => matFloor.roughness = v);

            refreshControls = () => items.forEach((f) => f());
        } catch (e) { console.error('Controls error', e); }

        // ---------------- Mouse: คลิกที่พื้นเพื่อย้ายแสง ----------------
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let downX = 0, downY = 0;
        renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
        renderer.domElement.addEventListener('pointerup', (e) => {
            // ถ้าลากกล้อง (เมาส์ขยับ) ไม่นับว่าเป็นการคลิก
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) return;
            mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);
            const hit = raycaster.intersectObject(plane)[0];
            if (hit) { directionalLight.position.set(hit.point.x, directionalLight.position.y, hit.point.z); refreshControls(); }
        });

        // ---------------- Mouse: ลากลูกบอลแสงเพื่อย้ายตำแหน่งแหล่งกำเนิดแสง ----------------
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const dragPoint = new THREE.Vector3();
        const dragNormal = new THREE.Vector3();
        let draggingLight = false;
        function setMouse(e) {
            mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);
        }
        // capture: ให้ทำงานก่อน OrbitControls เพื่อไม่ให้กล้องหมุนตอนลากแสง
        renderer.domElement.addEventListener('pointerdown', (e) => {
            setMouse(e);
            if (e.button === 0 && raycaster.intersectObject(lightMarker).length > 0) {
                draggingLight = true;
                controls.enabled = false;
                e.stopImmediatePropagation();
            }
        }, true);
        window.addEventListener('pointermove', (e) => {
            setMouse(e);
            if (draggingLight) {
                if (e.shiftKey) {
                    // Shift + ลาก: ขยับขึ้น-ลง (แกน Y) ด้วยระนาบตั้งที่หันเข้าหากล้อง
                    camera.getWorldDirection(dragNormal);
                    dragNormal.y = 0;
                    dragNormal.normalize();
                    dragPlane.setFromNormalAndCoplanarPoint(dragNormal, directionalLight.position);
                    if (raycaster.ray.intersectPlane(dragPlane, dragPoint)) {
                        directionalLight.position.y = Math.max(1, Math.min(20, dragPoint.y));
                    }
                } else {
                    // ลากปกติ: ขยับบนพื้น (แกน X, Z)
                    dragPlane.set(new THREE.Vector3(0, 1, 0), -directionalLight.position.y);
                    if (raycaster.ray.intersectPlane(dragPlane, dragPoint)) {
                        directionalLight.position.x = Math.max(-15, Math.min(15, dragPoint.x));
                        directionalLight.position.z = Math.max(-15, Math.min(15, dragPoint.z));
                    }
                }
                refreshControls();
            } else {
                renderer.domElement.style.cursor = raycaster.intersectObject(lightMarker).length > 0 ? 'grab' : '';
            }
        });
        window.addEventListener('pointerup', () => {
            if (draggingLight) { draggingLight = false; controls.enabled = true; }
        });

        // ---------------- Loop ----------------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            lightMarker.position.copy(directionalLight.position);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>

</html>
