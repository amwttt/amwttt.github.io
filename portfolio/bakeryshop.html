<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery Shop</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87CEEB;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const MODEL_URL = "https://amwttt.github.io/portfolio/prebakeryshop.glb";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(5, 4, 6);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      logarithmicDepthBuffer: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.minDistance = 0.1;
    controls.maxDistance = 1000;

    function frameModel(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxSize = Math.max(
        size.x,
        size.y,
        size.z
      );

      const distance =
        maxSize /
        (
          2 *
          Math.tan(
            THREE.MathUtils.degToRad(
              camera.fov / 2
            )
          )
        );

      camera.position.set(
        center.x + distance * 1.15,
        center.y + distance * 0.7,
        center.z + distance * 1.15
      );

      camera.near = Math.max(
        maxSize * 0.001,
        0.01
      );

      camera.far = Math.max(
        maxSize * 20,
        100
      );

      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    const loader = new THREE.GLTFLoader();

    loader.setCrossOrigin("anonymous");

    loader.load(
      MODEL_URL,
      function(gltf) {
        const model = gltf.scene;

        model.traverse(function(object) {
          if (object.isMesh && object.material) {
            const oldMaterial = object.material;

            if (Array.isArray(oldMaterial)) {
              object.material = oldMaterial.map(function(material) {
                return new THREE.MeshBasicMaterial({
                  map: material.map || null,
                  color: material.color
                    ? material.color.clone()
                    : new THREE.Color(0xffffff),
                  transparent: material.transparent,
                  opacity: material.opacity,
                  side: material.side,
                  alphaTest: material.alphaTest,
                  depthWrite: true,
                  depthTest: true
                });
              });
            } else {
              object.material = new THREE.MeshBasicMaterial({
                map: oldMaterial.map || null,
                color: oldMaterial.color
                  ? oldMaterial.color.clone()
                  : new THREE.Color(0xffffff),
                transparent: oldMaterial.transparent,
                opacity: oldMaterial.opacity,
                side: oldMaterial.side,
                alphaTest: oldMaterial.alphaTest,
                depthWrite: true,
                depthTest: true
              });
            }
          }
        });

        scene.add(model);
        frameModel(model);
      },
      undefined,
      function(error) {
        console.error("GLB loading error:", error);
      }
    );

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    window.addEventListener(
      "resize",
      function() {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      }
    );
  </script>
</body>
</html>
